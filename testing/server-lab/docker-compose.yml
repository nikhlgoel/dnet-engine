# T200 - the lab server. Privileged on purpose: it runs systemd and creates tunnel devices and firewall rules, as a
# machine of its own would. It is a throwaway; nothing here touches the host's network (the ports below are
# published on this computer's loopback address only, on different numbers from the harness's so both can run at once).
name: dnet-serverlab

services:
  server:
    build: .
    container_name: dnet-serverlab
    hostname: serverlab
    privileged: true
    cgroup: host
    devices:
      - /dev/net/tun
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "127.0.0.1:52820:52820/udp" # AmneziaWG
      - "127.0.0.1:45443:45443/udp" # Hysteria 2
      - "127.0.0.1:9443:9443/tcp" # VLESS+REALITY
    restart: "no"
