[package]
name = "dnet-tray"
version = "0.1.0"
edition = "2021"
# Tauri 2.12 requires Rust 1.90 (checked 2026-10-24 with `cargo +1.88.0 check`), so the shell's minimum is higher than the
# workspace's 1.88. It is detached, so this does not raise the engine's own MSRV; CI builds it on stable.
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/nikhlgoel/dnet-engine"
authors = ["DNet Engine contributors"]
description = "The DNet Engine tray icon and window: an unprivileged client of the control pipe (ADR-0007)."
publish = false

# Detached from the main workspace on purpose, as the measurement spike was: Tauri pulls in a large dependency
# tree (a web view binding, a windowing layer) that the engine's own builds, its MSRV check and its CI must not
# pay for. Everything that can be tested without a window lives in `dnet-view`, which is in the workspace.
[workspace]

[dependencies]
dnet-ipc = { path = "../../../crates/dnet-ipc" }
dnet-view = { path = "../../../crates/dnet-view" }
serde_json = "1"
# `tray-icon` is the native tray (ADR-0007 R1). No plugin is used: the capability list is the minimum (build.rs).
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", default-features = false, features = ["time", "sync", "macros"] }

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
