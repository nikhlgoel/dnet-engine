# Supply-chain guard (ADR-0007 R3: an npm tree is a supply chain, so it is kept small and visible).
#
# - A version must be at least 14 days old (in minutes) before it can be installed, so a freshly
#   published malicious release cannot arrive by a routine update.
# - Install scripts do not run unless listed here. None is.
minimumReleaseAge: 20160
onlyBuiltDependencies: []

# The test tooling (vitest, jsdom) pulls in an HTTP client with published advisories (GHSA-xjj6-f33q-929c and others,
# fixed in 8.12.2). It never ships (`pnpm audit --prod` is clean), but a developer's machine runs it, so it is held at
# the fixed version.
overrides:
  undici: ">=8.12.2"
