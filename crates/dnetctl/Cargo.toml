[package]
name = "dnetctl"
description = "Command-line client for the DNet Engine service: connect, disconnect, status, events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "dnetctl"
path = "src/main.rs"

[dependencies]
dnet-core = { workspace = true }
dnet-config = { workspace = true }
dnet-ipc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "io-util", "net", "signal"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "io-util", "net", "macros", "test-util", "sync"] }
