[package]
name = "dnet-probe"
description = "Races connection profiles through loopback SOCKS probes and measures usable throughput."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dnet-core = { workspace = true }
dnet-config = { workspace = true }
dnet-supervisor = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "sync", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt", "rt-multi-thread", "time", "net", "io-util"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
