[package]
name = "dnet-supervisor"
description = "Child process lifecycle for the supervised transport cores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dnet-core = { workspace = true }
dnet-config = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "time", "io-util", "sync", "macros"] }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time"] }
