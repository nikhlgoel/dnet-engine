[package]
name = "dnet-config"
description = "Generates configuration for the supervised transport cores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = { workspace = true }
dnet-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "fs", "rt", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "net", "io-util"] }
# The AWG contract tests assert the host-route/tunnel ordering, which lives in
# dnet-netstate. This is a dev-only dependency edge (dnet-netstate depends on
# dnet-config normally); Cargo permits a dev-dependency cycle.
dnet-netstate = { workspace = true }
