[package]
name = "dnet-config"
description = "Generates configuration for the supervised transport cores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dnet-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "fs", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The AWG contract tests assert the host-route/tunnel ordering, which lives in
# dnet-netstate. This is a dev-only dependency edge (dnet-netstate depends on
# dnet-config normally); Cargo permits a dev-dependency cycle.
dnet-netstate = { workspace = true }
