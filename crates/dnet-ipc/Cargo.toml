[package]
name = "dnet-ipc"
description = "Named-pipe protocol, framing, and the authorization boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dnet-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "macros"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_Security_Authorization"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
