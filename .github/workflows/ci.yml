name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Constitution licence obligations. Runs first and gates everything else:
  # a build that violates them is not shippable regardless of test results.
  licence-compliance:
    name: Licence obligations
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Reject vendored Wintun source; require signed DLL
        run: cargo xtask verify-vendor

      - name: Confine primary core vendor name to attribution surfaces
        run: cargo xtask lint-branding

  build-and-test:
    name: Build and test
    needs: licence-compliance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and contract tests
        run: cargo test --workspace

  # The declared minimum Rust version (Cargo.toml `rust-version`). Until 2026-10-21 nothing checked it and
  # the lockfile had drifted above it (T143); this keeps it true. Raise both together, deliberately.
  msrv:
    name: Minimum Rust version
    needs: licence-compliance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # CLAUDE.md: a change must not break the Linux build. dnetd is Windows-only and is not built here; the
  # crates that are meant to be portable are linted exactly as on Windows.
  linux-portable:
    name: Linux (portable crates)
    needs: licence-compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy on the portable crates
        run: >
          cargo clippy --all-targets
          -p dnet-core -p dnet-netstate -p dnet-ipc -p dnet-config
          -p dnet-supervisor -p dnet-probe -p dnet-view -p dnetctl
          -- -D warnings

  # ADR-0007: the window. The web view is checked on its own: types, the tests (including the contrast pairs
  # and the fixtures it shares with dnet-view), the size budget, and the dependency audit. Its dependencies
  # are held back 14 days and run no install scripts (pnpm-workspace.yaml), so a freshly published malicious
  # release cannot reach a build here.
  ui:
    name: Window (types, tests, budget, audit)
    needs: licence-compliance
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/dnet-tray
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dnet-tray/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build and hold it to the size budget
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod

  # The tray and window shell is detached from the workspace (Tauri's dependency tree would otherwise be paid
  # for by every other job), so it is built here, after the web view it embeds.
  ui-shell:
    name: Window shell (build, clippy)
    needs: ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dnet-tray/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dnet-tray/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/dnet-tray
      - run: pnpm build
        working-directory: apps/dnet-tray
      - run: cargo fmt --manifest-path apps/dnet-tray/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/dnet-tray/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --manifest-path apps/dnet-tray/src-tauri/Cargo.toml --release

  coverage:
    name: Coverage (>=80%)
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      # Constitution Principle IV: 80% floor on implemented, non-UI, non-vendor code.
      #
      # The floor is enforced per-crate, on the crates that are actually implemented.
      # This is deliberate: the workspace is built TDD-first, so several crates are
      # intentional skeletons (tests exist; `todo!()` bodies await their task). A
      # workspace-wide floor would fail on scaffolding by design. Each crate joins
      # this list when its implementing task lands — do not remove a crate once added.
      #
      #   dnet-core   : T023/T025 (health, tier, profile, session) and T059-T064 (decisions)
      #   dnet-ipc    : T022/T032-T035 (frame, protocol, authz, server)
      #   dnet-config : T040-T058 (core configuration generation, probe configuration)
      #   dnet-probe  : T059 (SOCKS5 client, measurement, race, runner)
      #
      # Measured 2026-10-16: 95% of lines across these four.
      #
      # Still to join: dnet-supervisor, dnet-netstate (OS-heavy; their elevated tests do not run
      # in CI), dnet-etw and dnet-provision (empty crates pending Phases 6 and 8).
      - name: Enforce coverage floor (implemented crates)
        run: >
          cargo llvm-cov
          --package dnet-core
          --package dnet-ipc
          --package dnet-config
          --package dnet-probe
          --fail-under-lines 80

  # Constitution Principle III: every network-path test runs against the simulated
  # hostile network, never live infrastructure. Enabled once Phase 0 (T010-T020) lands.
  harness:
    name: Integration (simulated network)
    needs: build-and-test
    runs-on: windows-latest
    if: false # enable at T020
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - name: Start simulation harness
        run: docker compose -f testing/harness/docker-compose.yml up -d --wait

      - name: Integration tests
        run: cargo nextest run --profile integration

      - name: Tear down
        if: always()
        run: docker compose -f testing/harness/docker-compose.yml down -v
