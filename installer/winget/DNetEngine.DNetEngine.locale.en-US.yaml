ShortDescription: Keeps your connection working on restrictive and unreliable networks, through an endpoint you own.
Description: |-
  DNet Engine is a self-hosted network resilience client for Windows. It connects through an endpoint
  you own, measures which connection method works on the network you are on, moves to another path
  when one degrades or drops, and restores your network settings exactly when it stops. It never ships
  with an endpoint, credential or key of its own.
